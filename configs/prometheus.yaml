global:
  scrape_interval: 15s

scrape_configs:
- job_name: "prometheus"
  static_configs:
  - targets: [ "prometheus:9090" ]

- job_name: "loki"
  static_configs:
  - targets: [ "loki:3100" ]

- job_name: "collector"
  static_configs:
  - targets: [ "otel-collector:8889" ]

- job_name: "tempo"
  static_configs:
  - targets: [ "tempo:3200" ]

- job_name: "rabbitmq"
  metrics_path: /metrics
  static_configs:
  - targets:
    - "rabbitmq:15692"

- job_name: 'redis_exporter'
  static_configs:
  - targets: [ 'redis-exporter:9121' ]

